name: diag
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          W=0xf0318c32136c2db7fec88b84869aee6a1106c80c
          for u in "https://data-api.polymarket.com/trades?user=$W&limit=2" "https://data-api.polymarket.com/trades?user=$W&limit=2&takerOnly=true" "https://data-api.polymarket.com/v1/trades?user=$W&limit=2" "https://data-api.polymarket.com/activity?user=$W&limit=2&type=TRADE" "https://data-api.polymarket.com/v1/activity?user=$W&limit=2&type=TRADE" "https://data-api.polymarket.com/positions?user=$W&limit=1"; do
            echo "=== $u"; curl -s -m 20 -w "\nHTTP %{http_code}\n" "$u" | head -c 1500; echo
          done
