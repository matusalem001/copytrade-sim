name: Simulation copy-trading

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: simulation
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Lancer la simulation
        run: python3 copytrade_sim.py
      - name: Sauvegarder les résultats
        run: |
          git config user.name "simulation-bot"
          git config user.email "simulation-bot@users.noreply.github.com"
          git add -A data RAPPORT.md
          git diff --cached --quiet && exit 0
          git commit -q -m "Mise à jour simulation"
          for i in 1 2 3 4 5; do
            git pull --rebase -q -X theirs && git push -q && exit 0
            sleep $((i * 5))
          done
          echo "Sauvegarde impossible, elle sera refaite au prochain passage"
