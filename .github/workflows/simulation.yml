name: Simulation copy-trading

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: simulation
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Lancer la simulation
        run: python3 copytrade_sim.py
      - name: Sauvegarder les résultats
        run: |
          git config user.name "simulation-bot"
          git config user.email "simulation-bot@users.noreply.github.com"
          git add -A data RAPPORT.md
          git diff --cached --quiet || git commit -m "Mise à jour simulation"
          git pull --rebase --quiet || true
          git push
